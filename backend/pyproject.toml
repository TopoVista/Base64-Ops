[project]
name = "langgraph-devops-agent-api"
version = "0.1.0"
description = "FastAPI, LangGraph, LangChain, MongoDB backend for the DevOps coding agent."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
