services:
  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/.workspaces:/app/.workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - mongo

  client:
    build:
      context: ./client
    environment:
      VITE_BASE_API_URL: http://localhost:8000/api/
    ports:
      - "5173:80"
    depends_on:
      - api

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
