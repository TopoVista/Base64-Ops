name: Manually Enabled Evaluation (No Provider Calls)

on:
  workflow_dispatch:
    inputs:
      max_cases:
        description: 'Maximum live model cases to run'
        required: false
        default: '5'
      live_repo:
        description: 'Allowlisted test repository URL'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: manual-evals-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-evaluation:
    name: Deterministic Evaluation With Explicit External Status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Run Live Evaluation Runner
        env:
          BASE64_ENABLE_LIVE_EVALS: "true"
          MAX_CASES: ${{ inputs.max_cases }}
          BASE64_LIVE_TEST_REPOSITORY: ${{ inputs.live_repo }}
          BASE64_LIVE_EVAL_ALLOWED_REPOS: ${{ secrets.BASE64_LIVE_EVAL_ALLOWED_REPOS }}
        run: |
          case "$MAX_CASES" in
            ''|*[!0-9]*) echo "max_cases must be a non-negative integer"; exit 1 ;;
          esac
          if [ "$MAX_CASES" -gt 5 ]; then
            echo "max_cases cannot exceed 5"; exit 1
          fi
          cd backend
          python -m evals.runner --mode live --max-cases "$MAX_CASES"
