name: CI Regression Gate

on:
  push:
    branches: [main, master, "agent/*", "base64/*"]
  pull_request:
    branches: [main, master]

jobs:
  backend-unit-tests:
    name: Backend Unit Tests & Ruff Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest ruff

      - name: Run Ruff Lint Check
        run: |
          cd backend
          ruff check .

      - name: Run Backend Unit Tests
        run: |
          cd backend
          pytest

  deterministic-evals:
    name: Deterministic Eval Suite & Patch Safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Run Deterministic Eval Runner
        run: |
          cd backend
          python -m evals.runner

  frontend-build:
    name: Frontend TypeScript & Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: TypeScript Check
        run: |
          cd client
          npx tsc --noEmit

      - name: Frontend Build
        run: |
          cd client
          npm run build
