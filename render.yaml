# Render Blueprint: API, bounded maintenance cron, indexer, and read-only CI observer workers.
# Secrets use sync: false so Render prompts for them during initial Blueprint setup.
services:
  # Shared, private rate-limit state. This is deliberately separate from
  # request-local memory so all API instances enforce the same tenant/user
  # ceilings. It accepts no public connections; application services use the
  # Render private-network connection string below.
  - type: keyvalue
    name: base64-ops-rate-limits
    region: oregon
    # Free is appropriate for the current demo deployment. Upgrade before
    # relying on uninterrupted production-wide rate-limit availability.
    plan: free
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off
    ipAllowList: []

  - type: web
    name: base64-ops-api
    runtime: python
    region: oregon
    # The reference profile stays within the requested 512 MB service tier.
    # Keep one bounded public control plane and add capacity only after an
    # observed staging limit justifies revising this reviewed profile.
    plan: 0.5c-512mb
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # `/health` is liveness and remains diagnostic during an Atlas outage;
    # `/ready` is strict so Render does not route customer traffic to an API
    # replica that cannot enforce tenant, quota, or approval invariants.
    healthCheckPath: /ready
    # External model calls are bounded, but SSE clients still need graceful
    # drain time on deploy. This is an intentionally fixed, reviewed capacity
    # profile; add autoscaling only after measuring queue latency and revising
    # the total provisioned CPU budget in deployment documentation.
    maxShutdownDelaySeconds: 120
    # Current Render Blueprint field: deploy only after the linked GitHub
    # checks pass. This replaces the deprecated `autoDeploy` syntax.
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ENVIRONMENT
        value: production
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: langgraph_devops_agent
      - key: MONGO_MAX_POOL_SIZE
        value: "12"
      - key: MONGO_WAIT_QUEUE_TIMEOUT_MS
        value: "5000"
      # Render's native runtime does not expose Docker isolation. Never run
      # repository-controlled validation commands in the API process.
      - key: EXECUTION_MODE
        value: disabled
      - key: INDEXING_MODE
        value: queued
      # Browser session reads must not fan out into GitHub API/workspace work.
      # CI is refreshed explicitly and after a delivered change instead.
      - key: CI_AUTO_REFRESH_SECONDS
        value: "0"
      # Per-tier safety ceilings for provider-reported model usage. These are
      # usage limits, not prices; tune after observing real tenant workloads.
      - key: FREE_MONTHLY_MODEL_TOKENS
        value: "250000"
      - key: PRO_MONTHLY_MODEL_TOKENS
        value: "5000000"
      - key: TEAM_MONTHLY_MODEL_TOKENS
        value: "25000000"
      - key: USE_DOCKER_WORKSPACES
        value: "false"
      - key: VALIDATION_MEMORY_MB
        value: "384"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: TRUSTED_HOSTS
        sync: false
      # Shared Redis is required for production-wide rate limits across API
      # instances. Render resolves this private-network URL during Blueprint
      # sync; the API fails closed for non-health requests if it is down.
      - key: REDIS_URL
        fromService:
          name: base64-ops-rate-limits
          type: keyvalue
          property: connectionString
      - key: RATE_LIMIT_FAIL_CLOSED
        value: "true"
      # Render routes public traffic through Cloudflare, which overwrites this
      # single-IP header. Do not use X-Forwarded-For as a rate-limit identity.
      - key: TRUSTED_CLIENT_IP_HEADER
        value: CF-Connecting-IP
      - key: BASE_URL
        # Public, deterministic service URL used for GitHub OAuth callbacks.
        # Keeping this explicit prevents the development localhost fallback
        # from being used by a newly created Render service.
        value: https://base64-ops-api.onrender.com
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_STATE_SECRET
        generateValue: true
      - key: GITHUB_TOKEN_ENCRYPTION_KEY
        # This is a strict Fernet key, not an arbitrary generated password.
        # Supply a value created with Fernet.generate_key() through Render's
        # secret manager so startup validation and encryption use the same
        # exact URL-safe base64 format.
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PRO_PLAN_ID
        sync: false
      - key: RAZORPAY_TEAM_PLAN_ID
        sync: false
      - key: CHAT_MODEL
        value: gpt-5.6-terra
      - key: SUPPORT_MODEL
        value: gpt-5.6-luna

  - type: cron
    name: base64-maintenance
    runtime: python
    region: oregon
    plan: 0.5c-512mb
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.workers.worker --once
    schedule: "0 */6 * * *"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ENVIRONMENT
        value: production
      - key: SERVICE_ROLE
        value: maintenance
      - key: MONGO_URI
        fromService:
          name: base64-ops-api
          type: web
          envVarKey: MONGO_URI
      - key: MONGO_MAX_POOL_SIZE
        value: "3"

  # Long-running clone and index work is deliberately kept out of API request
  # handlers. This worker accepts only server-created job IDs/payloads.
  - type: worker
    name: base64-indexer
    runtime: python
    region: oregon
    # A separate 512 MB worker keeps bounded clone/index/graph work off the
    # public API without overstating the initial production capacity.
    plan: 0.5c-512mb
    maxShutdownDelaySeconds: 120
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.workers.worker
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ENVIRONMENT
        value: production
      - key: SERVICE_ROLE
        value: indexer
      - key: MONGO_URI
        fromService:
          name: base64-ops-api
          type: web
          envVarKey: MONGO_URI
      - key: MONGO_DB_NAME
        value: langgraph_devops_agent
      - key: MONGO_MAX_POOL_SIZE
        value: "3"
      - key: BACKGROUND_JOB_LEASE_SECONDS
        value: "900"
      # Aggregate corpus limits keep a legitimate large repository from
      # turning one graph/index job into unbounded memory or Atlas writes.
      - key: RAG_INDEX_MAX_FILES
        value: "200"
      - key: RAG_INDEX_MAX_TOTAL_BYTES
        value: "6000000"
      - key: RAG_INDEX_MAX_CHUNKS
        value: "4000"
      - key: GITHUB_TOKEN_ENCRYPTION_KEY
        fromService:
          name: base64-ops-api
          type: web
          envVarKey: GITHUB_TOKEN_ENCRYPTION_KEY

  # Delivery CI status is a read-only observer. It never reruns, cancels, or
  # dispatches workflows; it reports only runs tied to the delivered SHA.
  - type: worker
    name: base64-ci-observer
    runtime: python
    region: oregon
    # This read-only observer remains a 512 MB, one-at-a-time consumer. It
    # cannot rerun, cancel, or dispatch GitHub Actions workflows.
    plan: 0.5c-512mb
    maxShutdownDelaySeconds: 120
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.workers.worker
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ENVIRONMENT
        value: production
      - key: SERVICE_ROLE
        value: ci_observer
      - key: MONGO_URI
        fromService:
          name: base64-ops-api
          type: web
          envVarKey: MONGO_URI
      - key: MONGO_DB_NAME
        value: langgraph_devops_agent
      - key: MONGO_MAX_POOL_SIZE
        value: "3"
      - key: BACKGROUND_JOB_LEASE_SECONDS
        value: "900"
      - key: GITHUB_TOKEN_ENCRYPTION_KEY
        fromService:
          name: base64-ops-api
          type: web
          envVarKey: GITHUB_TOKEN_ENCRYPTION_KEY
