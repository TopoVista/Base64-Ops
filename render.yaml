# Render Blueprint: one public API and one bounded maintenance cron (two Render services).
# Secrets use sync: false so Render prompts for them during initial Blueprint setup.
services:
  - type: web
    name: base64-ops-api
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ENVIRONMENT
        value: production
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: langgraph_devops_agent
      # Render's native runtime does not expose Docker isolation. Never run
      # repository-controlled validation commands in the API process.
      - key: EXECUTION_MODE
        value: disabled
      - key: USE_DOCKER_WORKSPACES
        value: "false"
      - key: VALIDATION_MEMORY_MB
        value: "384"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: BASE_URL
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_STATE_SECRET
        generateValue: true
      - key: GITHUB_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: CHAT_MODEL
        value: gpt-5.6-terra
      - key: SUPPORT_MODEL
        value: gpt-5.6-sol

  - type: cron
    name: base64-maintenance
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.workers.worker --once
    schedule: "0 */6 * * *"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SERVICE_ROLE
        value: maintenance
      - key: MONGO_URI
        sync: false
